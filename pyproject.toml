[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slopbench"
version = "0.1.0"
description = "Measure how often a model invents software dependencies, and how often it invents the same one twice."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Blvkware"}]
keywords = [
  "slopsquatting", "package-hallucination", "llm", "llm-security", "ai-coding-agents",
  "supply-chain-security", "hallucination", "benchmark", "pypi", "npm", "crates-io",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# The distribution is blvkware-pkgguard; it installs the `pkgguard` module.
# The bare PyPI name "pkgguard" is unregistered: depending on it would let
# whoever registers it first run code on every machine that installs this extra.
pkgguard = ["blvkware-pkgguard>=0.1.2"]
dev = ["pytest>=7"]

[project.scripts]
slopbench = "slopbench.cli:main"

[project.urls]
Homepage = "https://blvkware.dev"
Source = "https://github.com/rxslice/slopbench"
Issues = "https://github.com/rxslice/slopbench/issues"
Results = "https://blvkware.dev/ai-package-hallucination-data/"

[tool.setuptools.packages.find]
include = ["slopbench*"]

[tool.setuptools.package-data]
slopbench = ["data/*.json"]
